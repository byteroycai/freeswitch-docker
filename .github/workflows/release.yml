name: release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

# Builds multi-arch images (amd64 + arm64) and pushes to Docker Hub on tag
# push. Requires repository secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# and the repository variable DOCKERHUB_REPO (e.g. "your-user/freeswitch").
jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Derive tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ vars.DOCKERHUB_REPO }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=1.10,enable=${{ startsWith(github.ref, 'refs/tags/v1.10') }}
                      type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

            - name: Build and push runtime image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
