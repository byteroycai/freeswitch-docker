name: build

on:
    pull_request:
    push:
        branches: [main]

# Source compile is slow; this job only verifies amd64 builds successfully
# on PRs / pushes to main. Multi-arch publishing happens in release.yml.
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build runtime image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  platforms: linux/amd64
                  push: false
                  load: true
                  tags: freeswitch:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: |
                  docker run --rm freeswitch:ci freeswitch -version
                  docker run --rm freeswitch:ci ls /usr/local/freeswitch/mod | head -20
